services:
  backend:
    image: neovids-ideas-hub-backend:local
    environment:
      MEDIA_INDEXER_BASE_URL: http://media-indexer:8000
    networks:
      default: {}
      neovids:
        aliases: [ideas-hub]
  frontend:
    image: neovids-ideas-hub-frontend:local

networks:
  neovids:
    name: ${NEOVIDS_NETWORK:-neovids}
    external: true
